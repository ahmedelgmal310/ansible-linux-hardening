---
node_exporter_version: "1.12.1"
# sha256 of the release tarballs, from the upstream sha256sums.txt.
node_exporter_checksums:
  amd64: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
  arm64: ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7
node_exporter_download_base: https://github.com/prometheus/node_exporter/releases/download

# Expose metrics on this address. Allow the port only from the monitoring
# network through firewall_allow, for example:
#   - { port: 9100, proto: tcp, src: 10.0.0.0/24, comment: node_exporter }
node_exporter_listen_address: "0.0.0.0:9100"
node_exporter_install_dir: /opt/node_exporter
node_exporter_user: node_exporter
node_exporter_extra_args:
  - --collector.systemd
  - --no-collector.wifi

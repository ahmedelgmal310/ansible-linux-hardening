---
- name: Map the CPU architecture to the release name
  ansible.builtin.set_fact:
    node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

- name: Create the service group
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true

- name: Create the service account
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent

- name: Create the versioned install directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the release tarball (checksum verified)
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_base }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}/node_exporter-{{ node_exporter_version }}.tar.gz"
    checksum: "sha256:{{ node_exporter_checksums[node_exporter_arch] }}"
    owner: root
    group: root
    mode: "0644"

- name: Unpack the binary
  ansible.builtin.unarchive:
    src: "{{ node_exporter_install_dir }}/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}/node_exporter"

- name: Link the active version
  ansible.builtin.file:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_version }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
  notify: Restart node_exporter

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

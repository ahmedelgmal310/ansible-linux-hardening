---
kernel_hardening_sysctl_file: /etc/sysctl.d/60-hardening.conf

# Apply values to the running kernel as well as persisting them.
kernel_hardening_apply_live: true

# CIS 3.3.x (network) and 1.5.x (process hardening).
kernel_hardening_sysctls:
  # 3.3.1 IP forwarding off (this host is not a router)
  net.ipv4.ip_forward: 0
  # 3.3.2 / 3.3.5 / 3.3.6 ICMP redirects
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  # 3.3.3 bogus ICMP responses / 3.3.4 broadcast ICMP
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  # 3.3.7 reverse path filtering
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  # 3.3.8 source routed packets
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  # 3.3.9 log martians
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  # 3.3.10 TCP SYN cookies
  net.ipv4.tcp_syncookies: 1
  # 1.5.1 ASLR, 1.5.2 ptrace scope, 1.5.3 core dumps of setuid programs
  kernel.randomize_va_space: 2
  kernel.yama.ptrace_scope: 1
  fs.suid_dumpable: 0
  # Additional kernel self-protection
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.sysrq: 0
  kernel.unprivileged_bpf_disabled: 1
  dev.tty.ldisc_autoload: 0
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  fs.protected_fifos: 2
  fs.protected_regular: 2

# CIS 3.3.x IPv6 equivalents, applied only when the IPv6 stack is present.
kernel_hardening_ipv6_sysctls:
  net.ipv6.conf.all.forwarding: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0

kernel_hardening_extra_sysctls: {}

# CIS 1.1.1.x: filesystems that servers do not need.
kernel_hardening_disabled_filesystems:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - udf

# CIS 3.2.x and 1.1.1.x: uncommon network protocols and USB storage.
kernel_hardening_disabled_modules:
  - dccp
  - sctp
  - rds
  - tipc
  - usb-storage
  - firewire-core

# CIS 1.5.x: disable core dumps for all users.
kernel_hardening_disable_core_dumps: true

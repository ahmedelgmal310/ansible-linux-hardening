---
- name: Configure dnf-automatic for security updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { option: upgrade_type, value: security }
    - { option: download_updates, value: "yes" }
    - { option: apply_updates, value: "yes" }
    - { option: reboot, value: "{{ 'when-needed' if base_auto_reboot else 'never' }}" }

- name: Enable dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started

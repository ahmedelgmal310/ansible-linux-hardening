---
- name: Load distribution specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Decide whether auditd can run on this host
  ansible.builtin.set_fact:
    audit_service_active: >-
      {{ audit_manage_service and not (audit_skip_service_in_containers
         and ansible_facts['virtualization_role'] | default('') == 'guest'
         and ansible_facts['virtualization_type'] | default('') in ['docker', 'podman', 'container', 'containerd', 'lxc']) }}

- name: Install auditd
  ansible.builtin.package:
    name: "{{ audit_os_packages }}"
    state: present

- name: Configure auditd log handling
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: max_log_file, value: "{{ audit_max_log_file }}" }
    - { key: max_log_file_action, value: "{{ audit_max_log_file_action }}" }
    - { key: num_logs, value: "{{ audit_num_logs }}" }
    - { key: space_left_action, value: "{{ audit_space_left_action }}" }
    - { key: action_mail_acct, value: "{{ audit_action_mail_acct }}" }
    - { key: admin_space_left_action, value: "{{ audit_admin_space_left_action }}" }
    - { key: disk_full_action, value: "{{ audit_disk_full_action }}" }
    - { key: disk_error_action, value: "{{ audit_disk_error_action }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Restart auditd

- name: Deploy CIS audit rules
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/audit/rules.d/{{ item }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - 50-cis.rules
    - 99-finalize.rules
  notify: Compile audit rules

- name: Enable auditd at boot
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true

- name: Start auditd
  when: audit_service_active | bool
  ansible.builtin.systemd_service:
    name: auditd
    state: started

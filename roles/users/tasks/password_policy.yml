---
- name: Set password aging and umask defaults in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^\\s*#?\\s*{{ item.key }}\\s"
    line: "{{ item.key }}\t{{ item.value }}"
    state: present
  loop:
    - { key: PASS_MAX_DAYS, value: "{{ users_pass_max_days }}" }
    - { key: PASS_MIN_DAYS, value: "{{ users_pass_min_days }}" }
    - { key: PASS_WARN_AGE, value: "{{ users_pass_warn_age }}" }
    - { key: UMASK, value: "{{ users_login_umask }}" }
  loop_control:
    label: "{{ item.key }}"

- name: Create pwquality drop-in directory
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure password quality requirements
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"

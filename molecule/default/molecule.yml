---
# One scenario, parameterised by MOLECULE_IMAGE so CI can run it as a matrix.
driver:
  name: docker

platforms:
  - name: instance
    image: ${MOLECULE_IMAGE:-mirror.gcr.io/library/ubuntu:24.04}
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      interpreter_python: auto_silent
  inventory:
    group_vars:
      all:
        molecule_test_key: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/id_ed25519"
        users_admins:
          - name: opsadmin
            comment: Test administrator (sudo with password)
            ssh_keys:
              - "{{ lookup('ansible.builtin.file', molecule_test_key + '.pub') }}"
            sudo: true
            sudo_nopasswd: false
          - name: deploy
            comment: Test automation account (passwordless sudo)
            ssh_keys:
              - "{{ lookup('ansible.builtin.file', molecule_test_key + '.pub') }}"
            sudo: true
            sudo_nopasswd: true
          - name: auditor
            comment: Test account without SSH access
            ssh_keys:
              - "{{ lookup('ansible.builtin.file', molecule_test_key + '.pub') }}"
            ssh_access: false
            sudo: false
        firewall_allow:
          - { port: 22, proto: tcp, src: any, comment: ssh }
          - { port: 9100, proto: tcp, src: 172.16.0.0/12, comment: node_exporter }

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
